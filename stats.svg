<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
      <style>
        .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 6px; }
        .header { font: 600 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58a6ff; }
        .stat-label { font: 500 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
        .stat-value { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
        .streak-num { font: 700 24px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f0883e; text-anchor: middle; }
        .streak-label { font: 500 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; text-anchor: middle; }
      </style>
      
      <!-- Card Container -->
      <rect width="800" height="400" class="bg"/>

      <!-- Header Section -->
      <text x="30" y="45" class="header">@Hiten1896's Live GitHub Metrics Dashboard</text>

      <!-- Stats Box 1 -->
      <text x="30" y="90" class="stat-label">Total Repositories:</text>
      <text x="220" y="90" class="stat-value">5</text>
      
      <text x="30" y="125" class="stat-label">Total Stars Earned:</text>
      <text x="220" y="125" class="stat-value">9</text>
      
      <text x="30" y="160" class="stat-label">Estimated Commits:</text>
      <text x="220" y="160" class="stat-value">125</text>
      
      <text x="30" y="195" class="stat-label">Pull Requests:</text>
      <text x="220" y="195" class="stat-value">15</text>

      <!-- Streak Boxes Overview -->
      <rect x="450" y="75" width="150" height="85" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="525" y="110" class="streak-num">260d</text>
      <text x="525" y="140" class="streak-label">Active Contributions</text>

      <rect x="620" y="75" width="150" height="85" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="695" y="110" class="streak-num">5</text>
      <text x="695" y="140" class="streak-label">Active Repos</text>

      <!-- Footer Info -->
      <text x="30" y="360" class="stat-label" fill="#6e7781">Synced via automated GitHub Actions workflow engine.</text>
    </svg>