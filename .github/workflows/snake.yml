name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate the snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Palette matches the new "mission control" stat-card theme
          # (cyan/violet accents, dark navy background) so the whole
          # profile reads as one consistent visual system.
          outputs: |
            year.svg?color_snake=#3ee8ff&color_dots=#141a2a,#123b45,#0d6a75,#12aebd,#3ee8ff&color_background=#05070d&gradient=0:#3ee8ff,50:#a78bfa,100:#ff7ad9
            year-light.svg?color_snake=#0894b3&color_dots=#eef1f8,#bfe6ec,#7dcedd,#2fabc4,#0894b3&color_background=#ffffff&gradient=0:#0894b3,50:#7c5cea,100:#d4459a
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Push generated snake to main
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update contribution snake animation [skip ci]"
          file_pattern: year.svg year-light.svg