name: refresh stats

on:
  schedule:
    - cron: "30 22 * * *" # Runs at 22:30 UTC (4:00 AM IST)
    workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pillow numpy opencv-python-headless rembg onnxruntime fonttools requests

      - name: Run Profile Generator Scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          python scripts/make_portrait.py
          python scripts/generate_stats.py
          
      - name: Commit and Push Changes
        run: |
          FILES="ascii.svg stats.svg streak.svg langs.svg year.svg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git diff --quiet && git diff --staged --quiet || (git commit -m "stats: daily automated update" && git push)
