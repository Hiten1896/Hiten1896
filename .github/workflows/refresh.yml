name: Refresh Profile Assets

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy opencv-python-headless rembg onnxruntime fonttools

      - name: Generate ASCII Portrait SVG
        run: |
          python scripts/make_portrait.py

      - name: Generate Profile Stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_stats.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascii.svg stats.svg streak.svg langs.svg year.svg
          if git diff --staged --quiet; then
            echo "No SVG updates detected. Skipping commit."
          else
            git commit -m "chore(profile): auto-refresh SVGs [skip ci]"
            git push origin main
          fi
