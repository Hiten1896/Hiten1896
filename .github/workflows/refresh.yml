name: Generate Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate stat cards (dark + light)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: Hiten1896
        run: python scripts/generate_stats.py

      - name: Commit and push
        run: |
          git config user.name "Hiten1896"
          git config user.email "hitensharma1896@gmail.com"
          git add *.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile stats [skip ci]"
          # pull --rebase + retry guards against a race with the snake
          # workflow (or a manual run) pushing to main at the same time
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done